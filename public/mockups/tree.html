<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hiisi: taitopuu</title>
<link rel="stylesheet" href="shared.css">
<style>
  .wrap { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
  .tree { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  svg { width: 100%; height: 100%; max-height: 100%; }
  .info { flex: none; }
  .info .name { font-size: 16px; font-weight: 900; color: var(--gold); display: flex; justify-content: space-between; align-items: baseline; }
  .info .name small { font-size: 11px; color: var(--muted); }
  .info .what { font-size: 12px; margin: 4px 0 6px; line-height: 1.3; }
  .info .reqs { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; }
  .info .reqs span { padding: 3px 8px; border-radius: 8px; background: rgba(255,255,255,0.07); font-weight: 700; }
  .info .reqs span.ok { color: var(--venom); }
  .info .reqs span.no { color: #ff8a70; }
  .info .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .pts { font-size: 12px; font-weight: 800; color: #fff; background: rgba(224,176,72,0.2); border: 1px solid var(--gold); border-radius: 8px; padding: 4px 10px; }
  @media (orientation: landscape) {
    .wrap { flex-direction: row; }
    .tree { flex: 1.3; }
    .info { flex: 1; align-self: center; }
  }
  text { font-family: system-ui, sans-serif; font-weight: 800; fill: var(--ink); }
  .node circle { stroke-width: 2.5; }
  .node.taken circle { fill: #e0b048; stroke: #fff2c0; }
  .node.taken text { fill: #2a1800; }
  .node.open circle { fill: #243024; stroke: #ece6d2; }
  .node.locked circle { fill: #141a14; stroke: #3a443a; }
  .node.locked text { fill: #6a7a6a; }
  .node.sel circle { stroke: #fff; stroke-width: 4; filter: drop-shadow(0 0 8px #ffd040); }
  .node .icon { font-size: 16px; }
  .node .lbl { font-size: 8.5px; text-anchor: middle; }
  .node .gate { font-size: 8px; fill: #ff8a70; text-anchor: middle; }
  .edge { stroke: #3a443a; stroke-width: 3; }
  .edge.lit { stroke: #e0b048; }
  .branch { font-size: 11px; text-anchor: middle; letter-spacing: 0.08em; }
</style>
</head>
<body>
<div class="screen">
  <h1>Taitopuu <small>Taso 7 · 2 pistettä jäljellä</small></h1>
  <div class="tabs"><div class="tab">Hahmo</div><div class="tab on">Taitopuu</div><div class="tab">Reppu</div><div class="tab">Kartta</div></div>
  <div class="wrap">
    <div class="tree"><svg id="svg" viewBox="0 0 400 310"></svg></div>
    <div class="info panel" id="info"></div>
  </div>
</div>
<div class="close">✕</div>
<script type="module">
  // Four branches around the heart. A node is bought with a point from a
  // character level; the branch's deeper nodes also ask for the skill's
  // use-level, so the tree follows what you actually fight with.
  const C = [200, 200];
  const branches = [
    { key: 'miekka', name: 'MIEKKA', skill: 'Miekka', lvl: 7, dir: [0, -1], color: '#ffd040', nodes: [
      { id: 'halkaisu', icon: '⚔', name: 'Halkaisu', what: 'Lyönti osuu kaikkiin kaaren sisällä. Tekniikka.', gate: 1, taken: true },
      { id: 'torjunta', icon: '🛡', name: 'Torjunta', what: 'Pito torjuu; oikeaan aikaan ajoitettu torjunta horjuttaa ryntääjän.', gate: 3, taken: true },
      { id: 'syoksy', icon: '➶', name: 'Syöksy', what: 'Syöksy kohti osoitettua vihollista ja lyö. Tekniikka.', gate: 6, taken: false, open: true },
      { id: 'pyorre', icon: '🌀', name: 'Pyörre', what: 'Pyörähdys osuu kaikkiin ympärillä kahdesti.', gate: 10 },
      { id: 'mestari', icon: '★', name: 'Miekkamestari', what: 'Jokainen kolmas osuma on kriittinen.', gate: 15 },
    ], side: [{ id: 'kasi', icon: '✚', name: 'Vahva käsi', what: '+15 % miekan vahinkoa.', gate: 2, from: 0, taken: true }, { id: 'ulottuvuus', icon: '↔', name: 'Ulottuvuus', what: 'Miekan kaari puolta pidempi.', gate: 5, from: 1, open: true }] },
    { key: 'jousi', name: 'JOUSI', skill: 'Jousi', lvl: 4, dir: [1, 0], color: '#8ae070', nodes: [
      { id: 'jannitys', icon: '🏹', name: 'Jännitys', what: 'Pito jännittää; täysi jännitys lävistää rivin.', gate: 1, taken: true },
      { id: 'ansa', icon: '🪤', name: 'Ansa', what: 'Laske ansa jalkoihin. Tekniikka.', gate: 3, taken: false, open: true },
      { id: 'sade', icon: '☄', name: 'Nuolisade', what: 'Nuolia sataa osoitettuun ympyrään.', gate: 6 },
      { id: 'kaksois', icon: '⇉', name: 'Kaksoisnuoli', what: 'Joka laukaus on kaksi nuolta.', gate: 10 },
      { id: 'haukka', icon: '★', name: 'Haukansilmä', what: 'Nuolet hakeutuvat; kantama rajaton.', gate: 15 },
    ], side: [{ id: 'hiljaa', icon: '🤫', name: 'Hiljainen jänne', what: 'Laukaus ei herätä nukkuvia.', gate: 2, from: 0, open: true }, { id: 'nopea', icon: '⏩', name: 'Nopea veto', what: 'Jännitys 30 % nopeampi.', gate: 5, from: 1 }] },
    { key: 'taika', name: 'TAIKA', skill: 'Tuli / Halla / Henki', lvl: 5, dir: [0, 1], color: '#ff7a2a', nodes: [
      { id: 'tulipallo', icon: '🔥', name: 'Tulipallo', what: 'Sauvan tuli lentää ja räjähtää laskeutumisympyrään.', gate: 1, taken: true },
      { id: 'seina', icon: '🧱', name: 'Liekkiseinä', what: 'Seinä tulta kaaren eteen, 5 s. Tekniikka.', gate: 3, taken: true },
      { id: 'hallanuoli', icon: '❄', name: 'Hallanuoli', what: 'Hallasauvan nuoli hidastaa ja jäädyttää kolmannella.', gate: 6, open: true },
      { id: 'suoja', icon: '✨', name: 'Suoja', what: 'Henkikilpi ottaa kolme osumaa. Tekniikka.', gate: 10 },
      { id: 'henkiapuri', icon: '★', name: 'Henkiapuri', what: 'Haltija taistelee rinnallasi kerroksen ajan.', gate: 15 },
    ], side: [{ id: 'lahde', icon: '💧', name: 'Taikalähde', what: '+10 taikapistettä, palautuu nopeammin.', gate: 2, from: 0, taken: true }, { id: 'palo', icon: '♨', name: 'Jälkipalo', what: 'Tuli palaa maassa 3 s.', gate: 5, from: 1, open: true }] },
    { key: 'varjo', name: 'VARJO', skill: 'Varjo', lvl: 2, dir: [-1, 0], color: '#8a7fd0', nodes: [
      { id: 'hiipiminen', icon: '🐾', name: 'Hiipiminen', what: 'Puoli tikkua hiipii; hiipijää ei nähdä hämärässä.', gate: 1, taken: false, open: true },
      { id: 'selka', icon: '🗡', name: 'Selkäänpuukotus', what: 'Isku huomaamattoman selkään on ×4.', gate: 3 },
      { id: 'savu', icon: '💨', name: 'Savu', what: 'Savupilvi katkaisee katseen 4 s. Tekniikka.', gate: 6 },
      { id: 'myrkky', icon: '☠', name: 'Myrkky', what: 'Tikarin osumat myrkyttävät.', gate: 10 },
      { id: 'varjomestari', icon: '★', name: 'Varjomestari', what: 'Tappo savussa ei herätä ketään.', gate: 15 },
    ], side: [{ id: 'kevyt', icon: '🪶', name: 'Kevyt askel', what: 'Ansat eivät laukea alla.', gate: 2, from: 0 }, { id: 'tiirikka', icon: '🔑', name: 'Tiirikka', what: 'Lukitut arkut ja ovet aukeavat.', gate: 5, from: 1 }] },
  ];
  const sel = 'syoksy';
  // Four rows, one per branch: the chain runs left to right, the side nodes
  // hang above their parent as small circles (their name shows on tap).
  const svg = document.getElementById('svg');
  let edges = '', nodes = '';
  const X0 = 78, STEP = 66, Y0 = 44, ROW = 74;
  branches.forEach((br, bi) => {
    const y = Y0 + bi * ROW;
    nodes += `<text class="branch" x="6" y="${y - 4}" style="fill:${br.color};text-anchor:start">${br.name}</text><text class="branch" x="6" y="${y + 10}" style="fill:${br.color};text-anchor:start;font-size:10px;letter-spacing:0">taito ${br.lvl}</text>`;
    let px = X0 - 30;
    br.nodes.forEach((n, i) => {
      const x = X0 + i * STEP;
      const state = n.taken ? 'taken' : n.open ? 'open' : 'locked';
      edges += `<line class="edge ${n.taken ? 'lit' : ''}" x1="${px}" y1="${y}" x2="${x}" y2="${y}"/>`;
      px = x;
      const badge = n.gate > br.lvl ? `<circle cx="${x + 13}" cy="${y - 12}" r="8" fill="#c04030" stroke="#0b0d0a" stroke-width="1.5"/><text x="${x + 13}" y="${y - 9}" text-anchor="middle" style="font-size:8px;fill:#fff">${n.gate}</text>` : '';
      nodes += `<g class="node ${state} ${n.id === sel ? 'sel' : ''}"><circle cx="${x}" cy="${y}" r="16"/><text class="icon" x="${x}" y="${y + 6}" text-anchor="middle">${n.icon}</text><text class="lbl" x="${x}" y="${y + 28}">${n.name}</text>${badge}</g>`;
    });
    for (const sd of br.side) {
      const fx = X0 + sd.from * STEP, sx = fx + 30, sy = y - 30;
      const state = sd.taken ? 'taken' : sd.open ? 'open' : 'locked';
      edges += `<line class="edge ${sd.taken ? 'lit' : ''}" x1="${fx}" y1="${y}" x2="${sx}" y2="${sy}" stroke-dasharray="3 3"/>`;
      nodes += `<g class="node ${state}"><circle cx="${sx}" cy="${sy}" r="10"/><text class="icon" x="${sx}" y="${sy + 4}" text-anchor="middle" style="font-size:10px">${sd.icon}</text></g>`;
    }
  });
  svg.setAttribute('viewBox', '0 0 400 310');
  svg.innerHTML = edges + nodes;
  const br = branches[0], n = br.nodes[2];
  document.getElementById('info').innerHTML = `
    <div class="name">${n.icon} ${n.name} <small>Miekka · tekniikka</small></div>
    <div class="what">${n.what} Osuma antaa miekan käyttökokemusta kuten tavallinen lyönti.</div>
    <div class="reqs"><span class="ok">1 piste · sinulla 2</span><span class="ok">Miekka 6 · sinulla 7</span><span class="ok">Torjunta opittu</span></div>
    <div class="row"><div class="btn primary">Opi Syöksy</div><div class="pts">Vaihto: Halkaisu → Syöksy napilla 2</div></div>
    <div class="row" style="font-size:11px;color:var(--muted)">Punainen numero on taidon taso, jonka solmu vaatii. Pyörre vaatii Miekka 10; kerroksen katto on nyt 8, joten se aukeaa kerroksella 5 aikaisintaan. Pienet solmut ovat sivuhaaroja: nimi näkyy napauttamalla.</div>`;
</script>
</body>
</html>
